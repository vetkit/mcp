# Dependency versions come from vetkit's monorepo and are overwritten by every export, so npm version
# updates are made there. Dependabot security updates (enabled in Settings) still open pull requests here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
